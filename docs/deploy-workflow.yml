# INSURANCE COPY — canonical location: .github/workflows/deploy.yml
# If the workflow is missing there (GitHub blocks app tokens from pushing
# workflow files), copy this file to .github/workflows/deploy.yml manually.

# AGON // SIGNAL ENGINE — automatic transmission to GitHub Pages.
# Every push to main rebuilds the machine and redeploys it to:
#   https://zazieproductions.github.io/index-organica/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # SPA fallback — a refresh on any deep path resolves back into the machine
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
